[viewBag]
==
<style>
.recipes{
    /*max-width: 1536px;*/
    margin: 0 auto;
    width: 100%;
    min-height: 80rem;
    background-image: url('https://www.frisianflag.com/themes/rainlab-bonjour/assets/ramadhan2024/Rectangle%206120@2x.png');
    background-size: cover;
    background-position: center;
}
.lamp-decoration{
    max-width: 1536px;
    margin: 0 auto;
    width: 100%;
    height: 40rem;
    padding: 0 2rem;
    display: flex;
    justify-content: space-between;
    margin-top: -10rem;   
}
.lamps{
    width: 20%;
    display: flex;
    justify-content: space-around;
}
.lamp_short{
    margin-top: -4rem;
    width: 100%; 
    height:100%;
}
.lamp-long-container{
    height:40rem;    
}
.lamp-short-container{
    height: 35rem;    
}
.cta-wa{
    width: 60%;
    height:100%;
    display: flex;
    align-items: center;
    justify-content: center;
}
.cta-wa-btn{
    width: 65%;
    height: 7rem;
    background-color: white;
    border-radius: 999px;
    position: relative;
    display: flex;
    justify-content: center;
    align-items: center;
    color: #4B4B4B;
}
.cta-wa-btn:hover{
    color: #4B4B4B;
}
.recipes-section{
    width: 80%;
    margin: -30px auto 0 auto;
}
.recipe-headline{
    color: #224C95;
    font-family: Uni-Sans !important;
    font-weight: 800;
    /*font-family: Amino-Black;*/
    font-size: 32px !important;
    margin-bottom: 3rem;
}
.recipe{
    width: 30%;
    margin:1rem;
}
.recipe-img-container{
    width: 100%; 
}
.recipe-img-container img{
    width:100%; 
    height: 100%; 
    object-fit: cover;
    border-radius: 20px;
}
.recipe-title{
    margin-top: 2rem;
    width: 100%;
    font-size: 30px;
    color: #224C95;
    font-weight: 800;
    /*font-family: Amino-Black;*/
    font-family: Uni-Sans !important;
    text-align: center;
    padding: 0px;
}
.card-bottom{
    width: 100%;
    min-height: 13rem;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
}
.recipe-btn{
    width: 100%;
    height: 5rem;
    background-image: linear-gradient(rgb(216,178,93),rgb(251,242,171),rgb(216,178,93));
    color: #224C95;
    border-radius: 9999px;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 25px;
    font-weight: 600;
    /*font-family: Amino-Black;*/
    font-family: Uni-Sans !important;
}
.recipe-btn:hover{
    color: white;
}
.cta-wa-btn-text{
    font-size: 25px; 
    font-weight:600;
}
.all-recipes-container{
    height: 0;
}
.cta-wa-logo{
    width: 90px;   
    height:auto;
}

@media only screen and (min-width: 770px) and (max-width: 1025px){
    .cta-wa-btn-text{
        font-size: 17px;
    }
    .cta-wa-btn {
        height: 5rem;
    }
    .cta-wa-logo{
        width: 75px;   
        height:auto;
    }
    .lamps{
        width: 25%;
    }
    .recipe-title {
        padding: 0 10px;
    }
}

@media only screen and (min-width: 432px) and (max-width: 769px){
    .lamp-long-container{
        height: 30rem;
    }
    .lamp-short-container{
        height: 25rem;
    }
    .lamps{
        width: 25%;
    }
    .cta-wa-btn {
        height: 5rem;    
    }
    .cta-wa-logo{
        width: 60px; 
        height:auto;
    }
    .cta-wa-btn-text{
        font-size: 12px;
    }
    .recipes-section{
        width: 100%;
        padding-left: 4rem;
    }
    .recipe-img-container {
        width: 100%;
        height: fit-content;
    }
}

@media only screen and (max-width: 431px){
    .recipes{
        margin: 0rem auto 2rem auto;
    }
    .lamp-decoration {
        margin-top: 0rem;
        height: 15rem;
    }
    .lamp-short-container, .lamp-long-container {
        height: 12rem;
    }
    .cta-wa-button{
        width: 90%;
    }
    .cta-wa-logo{
        width: 40px;   
        left: -2px !important;
        height:auto;
    }
    .cta-wa-btn-text{
        font-size: 10px;
    }
    .cta-wa-btn{
        width: 65%;
        height: 4rem;
    }
    .wa-btn-hdn{
        width: 40px;   
        height:auto;
    }
    .recipes{
        background-position: 0px -300px;
        background-repeat: no-repeat;   
        min-height: 50rem;
    }
    .recipe-headline {
        font-size: 22px !important;   
        margin-bottom: 2rem;
    }
    .recipe-img-container{
        width: 100%; 
        height: fit-content;
    }
    .recipe-title {
        font-size: 20px;
        padding: 0;
    }
    .recipe-btn {
        font-size: 16px;
        height: 4rem;
    }
    .card-bottom{
        min-height: 10rem;    
    }
    .recipes-section {
        width: 100%; 
        padding-left: 4rem;
    }
    
    
    
    
    .headliner-banner-upper-recipe {
        color: #224C95;
        font-family: Uni-Sans !important;
        font-weight: 800;
        font-size: 32px !important;
        margin-bottom: 1rem;   
        text-transform: capitalize;
        text-align:center;
    }
    .tips-2-recipe{
        width: 100%;  
        margin-bottom: 5rem;
    }
    .tips-2-container-recipe{
        max-width: 1536px;
        width: 80%;
        margin: 0 auto;
        position: relative;
        border-radius: 40px;
    }
    .tips-2-container-recipe img{
        width: 100%;
        height: 100%;
        border-radius: 40px;
    }
    .text-container{
        width: 100%; 
        height: 100%;
        position: absolute;
        z-index: 10;
        top: 0;
        display: flex;
        justify-content: center;
        flex-direction: row;
        gap: 2rem;
        align-items: flex-end;
        padding: 3rem 10rem;
    }
    .tips-headline-text{
        width: 40%;
        height: auto;
        font-size: 35px;
        /*font-family: Amino-Black;*/  
        font-family: Uni-Sans !important;
        color: #224C95;
        font-weight: 800;
        padding: 0 1rem;
    }
    .tips-btn{
        min-width: 18rem;
        height: 3rem;
        background-image: linear-gradient(rgb(216,178,93),rgb(251,242,171),rgb(216,178,93));
        color: #224C95;
        border-radius: 999px;
        padding: 0 2rem;
        /*font-family: Amino;*/
        font-family: Uni-Sans !important;
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 16px;
        font-weight:800;
        cursor: pointer;
    }
    .tips-image-mobile-recipe{
        display: none;    
    }
    .tips-image-desktop-recipe{
        display: block;    
    }
    
    @media only screen and (min-width: 432px) and (max-width: 1025px){
        .text-container {
            padding: 3rem;        
        }
        .tips-headline-text{
            padding: 0 1rem;
            width: 45%;
            font-size: 20px;
        }
        .tips-btn {
            min-width: 15rem;
            height: 3rem;
            font-size: 16px;
        }  
        .headliner-banner-upper-recipe {
            font-size: 20px !important;
        }
    }
    
    @media only screen and (max-width: 431px){
        .tips-2-container-recipe {
            width: 90%;
            /*height: 35rem;*/
            border-radius: 20px;
        }
        .tips-2-container-recipe img{
            width: 70%;
            height: 100%;
            object-fit: cover;
            border-radius: 20px;
            margin: 0 auto;
        }
        .tips-headline-text {
            width: 100%;
            font-size: 26px;
            text-align: center;
        }
        .text-container{
            padding: 2rem;
            align-items: flex-end;
        }
        .tips-image-mobile-recipe{
            display: block;    
        }
        .tips-image-desktop-recipe{
            display: none;    
        }
        .tips-btn{
            min-width: 10rem;
            height: 2rem;
            font-size: 12px;
        }
        .headliner-banner-upper-recipe {
            font-size: 20px !important;
        }
}
</style>

<script>
function handleRecipe(e){
    window.location.href = e.getAttribute('href');
}
$(document).ready(function(){
  $('.all-recipes-container').slick({
      slidesToShow: 3,
      slidesToScroll: 1,
      arrows: false,
      responsive: [
        {
          breakpoint: 1000,
