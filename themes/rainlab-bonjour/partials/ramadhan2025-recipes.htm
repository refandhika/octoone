[viewBag]
==
<style>
    .promo-item-btn {
        margin-top: 1rem;
        width: 100%;
        height: 5rem;
        background-image: linear-gradient(rgb(216, 178, 93), rgb(251, 242, 171), rgb(216, 178, 93));
        border-radius: 999px;
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 20px;
        color: #224C95;
        font-weight: 800;
        font-family: Uni-Sans !important;
    }
    .container-festive {
        max-width: 1536px;
        width: 80%;
        margin: 0 auto;
        position: relative;
        border-radius: 40px;    
    }
    .head-recipe {
        color: #224C95;
        font-family: Uni-Sans !important;
        margin-bottom: 3rem;
        text-align:center;
    }
    .w-full{
        width:100%;
        padding-bottom:2rem;
    }
    
    .multiple-items .slick-dots {
      bottom: -5rem !important;
      display: flex;
      justify-content: center;
      margin: 0;
      padding: 1rem 0;
      list-style: none;
    }
    
    .multiple-items .slick-dots button {
      display: block;
      width: 1rem; 
      height: 1rem;
      padding: 0;
      border: 2px solid #224C95;
      border-radius: 50%; 
      background-color: transparent;
      text-indent: -9999px;
      transition: all 0.3s ease;
    }
    .multiple-items .slick-dots li {
        width:fit-content !important;    
    }
    .multiple-items .slick-dots li button{
        background-color: white;
        border: 1px solid #224C95;
        height:10px;
        width:10px;
    }
    
    .multiple-items .slick-dots li.slick-active button {
      width: 3rem; 
      height: 1rem; 
      border-radius: 1rem; 
      background-color: #224C95; 
      border-color: #224C95; 
    }

    {% if inCategory %}
        .festive-slide{
            position: relative;
            top: 5rem;
        }
    {% else %}
        .festive-slide{
            position: relative;
            top: -10rem;
        }
    {% endif %}
    
    .multiple-items .slick-slide {
      margin: 0 15px;
    }
    
    .multiple-items .slick-list {
      margin-left: -15px;
      margin-right: -15px;
    }
    .img-festive {
        border-radius: 1rem;  
        width:100%;
        height:100%;
        
    }
    .title-recipe {
        font-weight: 700;
        padding-top:2rem;
        padding-bottom:2rem;
        font-size: 25px;
        color: #224C95;
        font-family: Uni-Sans !important;
        text-align:center;
    }
    .recipe-btn{
        width: 100%;
        height: 5rem;
        background-image: linear-gradient(rgb(216,178,93),rgb(251,242,171),rgb(216,178,93));
        color: #224C95;
        border-radius: 9999px;
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 25px;
        font-weight: 600;
        font-family: Uni-Sans !important;
    }
    .recipe-btn:hover{
        color: white;
    }
    @media only screen and (min-width: 432px) and (max-width: 1025px){
        .head-recipe {
            font-size: 20px !important;    
        }
        .title-recipe{
            font-size: 20px !important;    
        }
        .recipe-btn {
            font-size: 20px !important;    
            height:4rem;
        }
    }
    @media only screen and (max-width: 431px){
        .head-recipe {
            font-size: 20px !important;   
        }
        .title-recipe{
            font-size: 20px !important;    
        }
        .recipe-btn {
            font-size: 20px !important;  
            height:4rem;
        }
        
        {% if inCategory %}
            .festive-slide{
                top: 5rem;
                margin-bottom: 10rem;
            }
        {% else %}
            .festive-slide{
                top: -6rem;
            }
        {% endif %}
    }
</style>

<section class="festive-slide">
    <div class="container-festive">
        <h2 class="head-recipe">Temukan berbagai inspirasi Resep Makanan</h2>
        <div class="w-full">
            <div class="multiple-items">
              <div>
                  <img class="img-festive" src="{{ 'assets/ramadhan2025/Thumbnail [RTD]FESTIVE-KV-2025_Web-FF-300x500.png'|theme }}" alt="Slide 3">
                  <div class="title-recipe">Resep Sahur</div>
                  <div href="https://www.tokopedia.com/frisian-flag" class="recipe-btn">Selengkapnya</div>
              </div>
              <div class="">
                  <img class="img-festive" src="{{ 'assets/ramadhan2025/Thumbnail [SCM]FESTIVE-KV-2025_Web-FF-300x500.png'|theme }}" alt="Slide 1">
                  <div class="title-recipe">Resep Takjil</div>
                  <div href="https://www.tokopedia.com/frisian-flag" class="recipe-btn">Selengkapnya</div>
              </div>
              <div>
                  <img class="img-festive" src="{{ 'assets/ramadhan2025/Thumbnail [FMP]FESTIVE-KV-2025_Web-FF-300x500.png'|theme }}" alt="Slide 2">
                  <div class="title-recipe">Resep Kue Kering</div>
                  <div href="https://www.tokopedia.com/frisian-flag" class="recipe-btn">Selengkapnya</div>
              </div>
            </div>
        </div>
    </div>
</section>
<script>
  $(document).ready(function(){
    $('.multiple-items').slick({
        slidesToShow: 3,
        slidesToScroll: 3,
        dots: true,
        arrows: false,
        infinite: false,
        responsive: [
            {
                breakpoint: 768,
                settings: {
                    slidesToShow: 1.2, 
                    slidesToScroll: 1
                }
            }
        ]
    });
});
</script>
