[viewBag]
==
<style>
    .container-filter {
        max-width: 1536px;
        width: 80%;
        margin: 0 auto;
        position: relative;
        border-radius: 40px;    
    }
    .heading-filter {
        color: #224C95;
        font-family: Uni-Sans !important;
        margin-bottom: 3rem;   
        text-align:center;
        font-size:25px;
    }
    .parent-str{
        display:flex;
        flex-direction:row;
        justify-content:center;
        gap:3rem;
    }
    .chil-str {
        display:flex;
        flex-direction:column;
    }
    .title-fil {
        color:#224C95;
        padding-bottom:1rem;
    }
    .custom-select {
        position: relative;
        width: 250px;
        pointer-events: auto; 
    }
    .custom-select select {
        appearance: none;
        -webkit-appearance: none;
        -moz-appearance: none;
        width: 100%;
        padding: 7px 15px;
        font-size: 14px;
        color: #333;
        background-color: #f8f8f8;
        border: 1px solid #224C95;
        border-radius: 25px;
        outline: none;
        cursor: pointer;
        transition: all 0.3s ease;
        pointer-events: auto; 
    }
    
    .custom-select select:hover,
    .custom-select select:focus {
        border-color: #224C95;
        box-shadow: 0 0 5px rgba(34, 76, 149, 0.5);
    }
    
    .custom-select::before {
        content: '';
        position: absolute;
        top: 0;
        right: 40px;
        width: 1px;
        height: 100%;
        background-color: #224C95;
        z-index: 2;
        pointer-events: auto; 
    }
    
    .custom-select::after {
        content: '▼';
        position: absolute;
        top: 50%;
        right: 1px;
        transform: translateY(-50%);
        font-size: 12px;
        color: #333;
        width: 40px;
        height: 34px;
        background-color: #D4E3FC;
        border-top-right-radius: 25px;
        border-bottom-right-radius: 25px;
        text-align: center;
        line-height: 36px;
        z-index: 1;
        pointer-events: auto; 
    }
    
    
    
    .custom-select-mob {
        position: relative;
        display: inline-block;
        width: 250px;
        padding-top:1rem;
    }
    
    .custom-select-mob select {
        appearance: none;
        -webkit-appearance: none;
        -moz-appearance: none;
    
        width: 100%;
        padding: 7px 15px;
        font-size: 14px;
        color: #333;
        background-color: #f8f8f8;
        border: 1px solid white;
        border-radius: 25px;
        outline: none;
        cursor: pointer;
        transition: all 0.3s ease;
    }
    
    .custom-select-mob::after {
        content: '\f078';
        font-family: 'Font Awesome 5 Free';
        font-weight: 900;
        position: absolute;
        top: 65%;
        right: 15px;
        transform: translateY(-50%);
        font-size: 14px;
        color: #333;
        pointer-events: none;
    }
    .hidding-mob{
        color: #224C95;
        font-weight: bold;
        font-size: 16px;
    }
    .parr {
        width:100%;
        display:block;
    }
    .parr-mob{
        width:100%;
        display:none;
    }
    .filter-button {
        display: inline-flex;
        align-items: center;
        gap: 8px; 
        padding: 10px 20px;
        font-size: 16px;
        font-weight: 500;
        color: #224C95;
        background-color: transparent;
        border: 1px solid #224C95;
        border-radius: 20px;
        cursor: pointer;
        transition: all 0.3s ease;
    }
    .filter-button:hover {
        background-color: #224C95;
        color: #fff;
    }
    .filter-button:focus {
        outline: none;
        box-shadow: 0 0 5px rgba(34, 76, 149, 0.5);
    }
    .sidebar {
        position: fixed;
        top: 0;
        left: -100%;
        width: 300px;
        height: 100%;
        background-color: #D1ECFF;
        box-shadow: 2px 0 5px rgba(0, 0, 0, 0.2);
        transition: left 0.3s ease;
        z-index: 1000;
        display: flex;
        flex-direction: column;
    }
    .sidebar-header {
        display: none;
        justify-content: space-between;
        align-items: center;
        padding: 1rem;
        border-bottom: 1px solid #ddd;
        
    }
    .close-sidebar {
        background: none;
        border: none;
        font-size: 1.5rem;
        cursor: pointer;
        color: transparent;
    }
    .sidebar-content {
        padding: 3rem 1rem 1rem 1rem;
        display:flex;
        flex-direction:column;
        gap:1rem;
    }
    .sidebar.active {
        left: 0;
    }

    @media only screen and (max-width: 1024px){
        .parent-str{
            gap:1rem;
        }
    }
    @media only screen and (max-width: 966px){
        .parent-str{
            gap:1rem;
        }
        .custom-select {
            width:200px;
        }
    }
    @media only screen and (max-width: 768px){
        .heading-filter {
            font-size:20px;
            padding-top:2rem;
        }
        .parr {
            display:none;
        }    
        .parr-mob{
            display:flex;
            justify-content:end;
        }
    }
</style>

<div class="tips-2-recipe" style="margin-bottom: 5rem;">
    <div class="tips-2-container-recipe" href="#" onclick="handleRecipe(this)" style="cursor: pointer;">
        <div class="headliner-banner-upper-recipe heading-filter">Berbagai Tips Spesial Ramadan</div>
        <img src="https://www.frisianflag.com/storage/app/media/_mediathumbs/cropped-images/Group%204.png" alt="tips" class="tips-image-desktop" style="margin: 0 auto; width: 60%">
        <img src="https://www.frisianflag.com/storage/app/media/_mediathumbs/cropped-images/Group%208.png" alt="tips" class="tips-image-mobile">
    </div>
</div>
