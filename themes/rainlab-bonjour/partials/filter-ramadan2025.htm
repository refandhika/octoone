[viewBag]
==
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/jquery@3.6.0/dist/jquery.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>

<style>
    .only-desktop{
        display: block;    
    }
    .container-filter {
        max-width: 1536px;
        width: 80%;
        margin: 0 auto 5rem auto;
        position: relative;
        border-radius: 40px;
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
    }
    .heading-filter {
        color: #224C95;
        font-family: Uni-Sans !important;
        margin-bottom: 3rem;   
        text-align:center;
        font-size:25px;
    }
    .parent-str{
        display:flex;
        flex-direction:row;
        justify-content:center;
        gap:3rem;
    }
    .chil-str {
        display:flex;
        flex-direction:column;
    }
    .title-fil {
        color:#224C95;
        padding-bottom:1rem;
    }
    .custom-select {
        position: relative;
        width: 250px;
        pointer-events: auto; 
    }
    .custom-select select {
        appearance: none;
        -webkit-appearance: none;
        -moz-appearance: none;
        width: 100%;
        padding: 7px 15px;
        font-size: 14px;
        color: #333;
        background-color: #f8f8f8;
        border: 1px solid #224C95;
        border-radius: 25px;
        outline: none;
        cursor: pointer;
        transition: all 0.3s ease;
        pointer-events: auto; 
    }
    
    .custom-select select:hover,
    .custom-select select:focus {
        border-color: #224C95;
        box-shadow: 0 0 5px rgba(34, 76, 149, 0.5);
    }
    
    .custom-select::before {
        content: '';
        position: absolute;
        top: 0;
        right: 40px;
        width: 1px;
        height: 100%;
        background-color: #224C95;
        z-index: 2;
        pointer-events: auto; 
    }
    
    .custom-select::after {
        content: '▼';
        position: absolute;
        top: 50%;
        right: 1px;
        transform: translateY(-50%);
        font-size: 12px;
        color: #ffffff;
        width: 40px;
        height: 34px;
        background-color: #224c95;
        border-top-right-radius: 25px;
        border-bottom-right-radius: 25px;
        text-align: center;
        line-height: 36px;
        z-index: 1;
        pointer-events: auto; 
    }
    
    
    
    .custom-select-mob {
        position: relative;
        display: inline-block;
        width: 250px;
        padding-top:1rem;
    }
    
    .custom-select-mob select {
        appearance: none;
        -webkit-appearance: none;
        -moz-appearance: none;
    
        width: 100%;
        padding: 7px 15px;
        font-size: 14px;
        color: #333;
        background-color: #f8f8f8;
        border: 1px solid white;
        border-radius: 25px;
        outline: none;
        cursor: pointer;
        transition: all 0.3s ease;
    }
    
    .custom-select-mob::after {
        content: '\f078';
        font-family: 'Font Awesome 5 Free';
        font-weight: 900;
        position: absolute;
        top: 65%;
        right: 15px;
        transform: translateY(-50%);
        font-size: 14px;
        color: #333;
        pointer-events: none;
    }
    .custom-select-mob::after {
        content: '\f078';
        font-family: 'Font Awesome 5 Free';
        font-weight: 900;
        position: absolute;
        top: 65%;
        right: 15px;
        transform: translateY(-50%);
        font-size: 14px;
        color: #333;
        pointer-events: none;
    }
    .custom-select-mob:last-child::after {
        display: none !important;    
    }
    .hidding-mob{
        color: #224C95;
        font-weight: bold;
        font-size: 16px;
    }
    .parr {
        width:100%;
        display:block;
    }
    .parr-mob{
        width:100%;
        display:none;
    }
    .filter-button {
        display: inline-flex;
        align-items: center;
        gap: 8px; 
        padding: 10px 20px;
        font-size: 16px;
        font-weight: 500;
        color: #224C95;
        background-color: transparent;
        border: 1px solid #224C95;
        border-radius: 20px;
        cursor: pointer;
        transition: all 0.3s ease;
    }
    .filter-button:hover {
        background-color: #224C95;
        color: #fff;
    }
    .filter-button:focus {
        outline: none;
        box-shadow: 0 0 5px rgba(34, 76, 149, 0.5);
    }
    .sidebar {
        position: fixed;
        top: 0;
        left: -100%;
        width: 300px;
        height: 100%;
        background-color: #D1ECFF;
        box-shadow: 2px 0 5px rgba(0, 0, 0, 0.2);
        transition: left 0.3s ease;
        z-index: 1000;
        display: flex;
        flex-direction: column;
    }
    .sidebar-header {
        display: none;
        justify-content: space-between;
        align-items: center;
        padding: 1rem;
        border-bottom: 1px solid #ddd;
        
    }
    .close-sidebar {
        background: none;
        border: none;
        font-size: 1.5rem;
        cursor: pointer;
        color: transparent;
    }
    .sidebar-content {
        padding: 3rem 1rem 1rem 1rem;
        display:flex;
        flex-direction:column;
        gap:1rem;
    }
    .sidebar.active {
        left: 0;
    }
    .clear-btn{
        width: fit-content;
        padding: 10px 20px;
        background-color: #224c95;
        height: fit-content;
        border-radius: 999px;
        color: white;  
        cursor: pointer;
    }

    @media only screen and (max-width: 1024px){
        .parent-str{
            gap:1rem;
        }
    }
    @media only screen and (max-width: 966px){
        .parent-str{
            gap:1rem;
        }
        .custom-select {
            width:200px;
        }
    }
    @media only screen and (max-width: 768px){
        .heading-filter {
            font-size:20px;
            padding-top:2rem;
        }
        .parr {
            display:none;
        }    
        .parr-mob{
            display:flex;
            justify-content:end;
        }
    }
    @media only screen and (max-width: 431px){
        .only-desktop{
            display: none;    
        }
    }
</style>
<section class="container-filter only-desktop">
    <div class="heading-filter">Temukan Berbagai Resep Untuk Ramadan</div>

    <div class="parr">
        <div class="parent-str">
            <div class="chil-str">
                <div class="title-fil">Produk Yang Digunakan</div>
                <div class="custom-select">
                    <select 
                    id="produkDropdown" 
                    data-request="onDropdownChange" 
                    data-request-data="produkValue: $('#produkDropdown').val(), bahanValue: $('#bahanUtamaDropdown').val(), jenisValue: $('#jenisMakananDropdown').val()" 
                    onchange="$(this).request()">
                        <option disabled selected>Cari Produk</option>
                        <option value="Susu Cair">Susu Cair</option>
                        <option value="Susu Kental Manis">Susu Kental Manis</option>
                        <option value="Susu Bubuk">Susu Bubuk</option>
                    </select>
                </div>
            </div>
            <div class="chil-str">
                <div class="title-fil">Bahan Utama</div>
                <div class="custom-select">
                    <select id="bahanUtamaDropdown"
                    data-request="onDropdownChange" 
                    data-request-data="produkValue: $('#produkDropdown').val(), bahanValue: $('#bahanUtamaDropdown').val(), jenisValue: $('#jenisMakananDropdown').val()" 
                    onchange="$(this).request()">
                        <option disabled selected>Cari Bahan</option>
                        <option value="ayam">Ayam</option>
                        <option value="sapi">Sapi</option>
                        <option value="kambing">Kambing</option>
                        <option value="bebek">Bebek</option>
                        <option value="ikan-tuna">Ikan Tuna</option>
                        <option value="ikan-salmon">Ikan Salmon</option>
                        <option value="telur-ayam">Telur Ayam</option>
                        <option value="kacang-kedelai">Kacang Kedelai</option>
                        <option value="tahu">Tahu</option>
                        <option value="tempe">Tempe</option>
                        <option value="susu">Susu</option>
                        <option value="keju">Keju</option>
                        <option value="yogurt">Yogurt</option>
                    </select>
                </div>
            </div>
            <div class="chil-str">
                <div class="title-fil">Jenis Makanan</div>
                <div class="custom-select">
                    <select id="jenisMakananDropdown"
                    data-request="onDropdownChange" 
                    data-request-data="produkValue: $('#produkDropdown').val(), bahanValue: $('#bahanUtamaDropdown').val(), jenisValue: $('#jenisMakananDropdown').val()" 
                    onchange="$(this).request()">
                        <option disabled selected>Cari Jenis Makanan</option>
                        <option value="sahur">Sahur</option>
                        <option value="takjil">Takjil</option>
                        <option value="kue-kering">Kue Kering</option>
                    </select>
                </div>
            </div>
            <div class="chil-str" style="justify-content: flex-end;">
                <div class="clear-btn" 
                    data-request="onClear" 
                    data-request-data="jenisValue: window.location.pathname.split('/')[window.location.pathname.split('/').length-1]" 
                    onclick="$(this).request()">clear</div>
            </div>
        </div>
    </div>
</section>

<script>
    
    function getJenisValue() {
        let param = window.location.pathname.split('/')[window.location.pathname.split('/').length-1];
        if (param.includes('sahur')) {
            return "sahur";    
        } else if (param.includes('takjil')) {
            return "takjil";
        } else if (param.includes('kue-kering')) {
            return "kue-kering";
        }
    }

        });

</script>
